version: '2.2'

services:
  centralisedbackend:
    restart: unless-stopped
    build:
      context: ./Centralised-Backend
      dockerfile: Dockerfile
    ports:
      - "8017:8000"
    entrypoint: /Backend/wsgi-entrypoint.sh
    volumes:
      - ./Centralised-Backend:/Backend/
    expose:
      - 8000
    networks:
      - mynetwork
  

  centralisedfrontend:
    build:
      context: ./centralised-frontend
      dockerfile: Dockerfile
    ports:
      - "5024:3000"
    volumes:
      - ./centralised-frontend:/centralised-frontend
    networks:
      - mynetwork

networks:
  mynetwork:
    name: yearbook23_mynetwork
    external: true
